name: payflow

# Development mode: the source is mounted and the server restarts on change.

services:
  payflow:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c "pnpm install --frozen-lockfile --store-dir /pnpm-store && pnpm dev"
    environment:
      CI: 'true'
      DATABASE_PATH: /data/payflow.db
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-http://host.docker.internal:3000}
    ports:
      - '4010:4010'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm-store
      - data:/data
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  node_modules:
  pnpm_store:
  data:
